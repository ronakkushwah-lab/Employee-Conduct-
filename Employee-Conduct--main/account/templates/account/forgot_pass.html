{% extends 'account/base1.html' %}
{% block head %}
<style>
    .spinner{
        height:60px;width:60px;border: 6px solid #e9ecef;border-bottom:6px solid #007bff;
        animation:ani 1s linear infinite;border-radius: 50%;margin:auto
    }
    @keyframes ani{
        from{transform:rotate(0deg)}
        to{transform:rotate(360deg)}
    }
</style>
{% endblock %}
{% block myblock %}
    <div class="container">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="my-5 p-4 p-md-5 bg-white rounded shadow-sm border">
                    <h3 class="font-weight-bold text-dark mb-1">Reset Your Password</h3>
                    <p class="text-muted small mb-4">Enter your registered email address below to receive a password reset link.</p>
                    <hr>
                    <div id="result"></div>
                    <form id="resetRequestForm">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            <label class="font-weight-bold text-secondary">Registered Email Address</label>
                            <input type="email" class="form-control" id="reset_password_email" name="email" placeholder="e.g. user@company.com" required>
                        </div>
                        <button type="button" class="btn btn-primary btn-block py-2 font-weight-bold" onclick="getpass()" id="continue">
                            <i class="fa fa-paper-plane mr-2"></i> Send Password Reset Link
                        </button>
                        <div class="mt-3 text-center" style="display:none" id="spin">
                            <div class="spinner"></div>
                            <p class="text-muted small mt-2">Processing request...</p>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <a href="/" class="text-muted small"><i class="fa fa-arrow-left mr-1"></i> Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function getpass(){
            let email=$("#reset_password_email").val().trim();
            if(!email){
                $("#result").html("<p class='alert alert-danger'>Please enter a valid email address.</p>");
                return;
            }
            $("#spin").show();
            $("#continue").hide();
            $("#result").html("");

            $.ajax({
                url:"{% url 'reset_password' %}",
                type:"get",
                data:{'email':email},
                success:function(data){
                    $("#spin").hide();
                    $("#result").html(
                        "<div class='alert alert-success py-3'>"+
                        "<h6 class='font-weight-bold mb-1'><i class='fa fa-check-circle mr-2'></i>Reset Link Dispatched</h6>"+
                        "<p class='mb-0 small'>If an account exists for <strong>"+email+"</strong>, a password reset link has been sent to your email inbox. Please check your inbox and spam folder.</p>"+
                        "</div>"
                    );
                },
                error:function(){
                    $("#spin").hide();
                    $("#continue").show();
                    $("#result").html("<p class='alert alert-danger'>Something went wrong. Please try again later.</p>");
                }
            });
        }
    </script>
{% endblock %}
