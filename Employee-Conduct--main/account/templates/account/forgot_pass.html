{% extends 'account/base1.html' %}
{% block head %}
<style>
    .forgot-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-submit-reset {
        background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
        border: none;
        color: #ffffff;
        font-weight: 600;
        letter-spacing: 0.3px;
        transition: all 0.2s ease;
    }
    .btn-submit-reset:hover {
        background: linear-gradient(135deg, #172554 0%, #1d4ed8 100%);
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .spinner {
        height: 48px;
        width: 48px;
        border: 4px solid #e2e8f0;
        border-bottom: 4px solid #2563eb;
        animation: spin-ani 1s linear infinite;
        border-radius: 50%;
        margin: auto;
    }
    @keyframes spin-ani {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}
{% block myblock %}
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center py-5">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                <div class="p-4 p-md-5 forgot-card">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 56px; height: 56px; background: rgba(37, 99, 235, 0.1); color: #2563eb; font-size: 24px;">
                            <i class="fa fa-key"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Reset Password</h3>
                        <p class="text-muted small mb-0">Enter your registered email address to receive a secure password reset link.</p>
                    </div>

                    <div id="result"></div>

                    <form id="resetRequestForm" onsubmit="event.preventDefault(); getpass();">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Registered Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa fa-envelope"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="reset_password_email" name="email" placeholder="name@company.com" required autofocus>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-submit-reset w-100 py-2.5 rounded-3 mb-3" id="continue">
                            <i class="fa fa-paper-plane me-2"></i> Send Reset Link
                        </button>
                        <div class="text-center py-2" style="display:none" id="spin">
                            <div class="spinner"></div>
                            <p class="text-muted small mt-2 mb-0">Sending reset link...</p>
                        </div>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <a href="{% url 'signin' %}" class="text-decoration-none text-muted small fw-semibold">
                            <i class="fa fa-arrow-left me-1"></i> Back to Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function getpass(){
            let email = $("#reset_password_email").val().trim();
            if(!email){
                $("#result").html("<div class='alert alert-danger py-2 small'>Please enter a valid email address.</div>");
                return;
            }
            $("#spin").show();
            $("#continue").hide();
            $("#result").html("");

            $.ajax({
                url: "{% url 'reset_password' %}",
                type: "get",
                data: {'email': email},
                success: function(data){
                    $("#spin").hide();
                    $("#result").html(
                        "<div class='alert alert-success py-3 rounded-3'>"+
                        "<h6 class='fw-bold mb-1'><i class='fa fa-check-circle me-2'></i>Reset Link Dispatched</h6>"+
                        "<p class='mb-0 small text-secondary'>If an account exists for <strong>"+email+"</strong>, a password reset link has been sent to your email inbox. Please check your inbox and spam folder.</p>"+
                        "</div>"
                    );
                    $("#reset_password_email").prop('disabled', true);
                },
                error: function(){
                    $("#spin").hide();
                    $("#continue").show();
                    $("#result").html("<div class='alert alert-danger py-2 small'>Something went wrong while connecting to the email service. Please try again.</div>");
                }
            });
        }
    </script>
{% endblock %}
