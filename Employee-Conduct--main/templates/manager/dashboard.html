{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manager Dashboard | Eagle in Cloud HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'asets/css/eagle-brand.css' %}">
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(135deg, #0a0a0c 0%, #171111 50%, #000000 100%);
        min-height: 100vh;
        color: #ffffff;
      }
      .custom-navbar {
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(252, 1, 1, 0.2);
        padding: 0.75rem 1.5rem;
      }
      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ffffff !important;
        font-weight: 700;
        font-size: 1.15rem;
      }
      .navbar-brand img {
        height: 36px;
      }
      .navbar-text {
        color: #e2e8f0 !important;
        font-weight: 500;
        background: rgba(252, 1, 1, 0.15);
        border: 1px solid rgba(252, 1, 1, 0.3);
        padding: 4px 14px;
        border-radius: 20px;
      }
      .btn-logout {
        color: #FC0101;
        border-color: #FC0101;
        font-weight: 600;
        border-radius: 8px;
        transition: all 0.2s ease;
      }
      .btn-logout:hover {
        background: #FC0101;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(252, 1, 1, 0.4);
      }
      .dashboard-hover-card {
        background: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .dashboard-hover-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 25px 55px rgba(252, 1, 1, 0.15);
      }
      .dashboard-hover-btn {
        background: linear-gradient(135deg, #FC0101 0%, #B00101 100%);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        padding: 12px 28px;
        font-weight: 700;
        letter-spacing: 0.3px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 8px 20px rgba(252, 1, 1, 0.35);
      }
      .dashboard-hover-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(252, 1, 1, 0.5);
        color: #ffffff;
      }
      .back-btn {
        position: absolute;
        top: 25px;
        left: 25px;
        color: #64748b;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: color 0.2s ease;
        z-index: 10;
      }
      .back-btn:hover {
        color: #FC0101;
      }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'manager_dashboard' company_id company_staff_id %}">
                <img src="{% static 'asets/images/eagle_in_cloud_logo_white.svg' %}?v=4" alt="Eagle in Cloud">
                <span>Eagle in Cloud HRMS</span>
            </a>
            <span class="navbar-text ms-auto me-3">Manager Portal</span>
            <a class="btn btn-outline-danger btn-sm btn-logout" href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 mt-4">
                <div class="card dashboard-hover-card">
                    <a href="{% url 'signin' %}" class="back-btn">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                    <div class="card-body p-5 text-center">
                        <div class="mb-3">
                            <img src="{% static 'asets/images/eagle_in_cloud_logo.svg' %}?v=4" alt="Eagle in Cloud" style="height: 52px;">
                        </div>
                        <h1 class="card-title h3 mb-2" style="font-weight:800; color:#000000;">Manager Dashboard</h1>
                        <p class="text-muted mb-4" style="font-size: 1rem;">Welcome to Eagle in Cloud HRMS. Manage your team, track subordinate timesheets, leaves, and approvals.</p>
                        <a href="/managers/dashboard/{{ company_id }}/{{ company_staff_id }}/" class="btn dashboard-hover-btn">
                            <i class="fas fa-users-cog me-2"></i> Launch Manager Portal
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
