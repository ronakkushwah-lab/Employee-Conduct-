{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        min-height: 100vh;
      }
      .custom-navbar {
        background: rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .navbar-brand {
        color: #ffffff !important;
        font-weight: 700;
      }
      .navbar-text {
        color: #94a3b8 !important;
        font-weight: 500;
      }
      .btn-logout {
        color: #f87171;
        border-color: #f87171;
      }
      .btn-logout:hover {
        background: #f87171;
        color: #fff;
      }
      .dashboard-hover-card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .dashboard-hover-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }
      .dashboard-hover-btn {
        background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 600;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .dashboard-hover-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3);
        color: #fff;
      }
      .back-btn {
        position: absolute;
        top: 25px;
        left: 25px;
        color: #64748b;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: color 0.2s ease;
        z-index: 10;
      }
      .back-btn:hover {
        color: #3b82f6;
      }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'admin_dashboard' company_id company_staff_id %}">HRMS Portal</a>
            <span class="navbar-text ms-auto me-3">Admin</span>
            <a class="btn btn-outline-danger btn-sm btn-logout" href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 mt-5">
                <div class="card dashboard-hover-card">
                    <a href="{% url 'signin' %}" class="back-btn">
                        <i class="fas fa-arrow-left"></i> Back
                    </a>
                    <div class="card-body p-5 text-center">
                        <h1 class="card-title h3 mb-3" style="font-weight:700; color:#1e293b;">Admin Dashboard</h1>
                        <p class="text-muted mb-4" style="font-size: 1.1rem;">Welcome to the HRMS portal. You are logged in as Admin.</p>
                        <a href="/administration/index/{{ company_id }}/{{ company_staff_id }}/" class="btn dashboard-hover-btn">
                            <i class="fas fa-tachometer-alt me-2"></i> Go to Administration
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
