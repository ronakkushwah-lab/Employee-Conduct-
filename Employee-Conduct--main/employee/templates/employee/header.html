    <style>
      .sidebar_wrapper {
        background: linear-gradient(180deg, #07080b 0%, #000000 100%) !important;
        width: 250px;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        z-index: 11;
        border-right: 1px solid rgba(255, 255, 255, 0.05) !important;
      }
      .sidebar_wrapper a {
        color: #cbd5e1 !important;
        text-decoration: none !important;
      }
      .sidebar_wrapper .metismenu .mm-collapse:not(.mm-show) {
        display: none !important;
      }
      #preloader {
        background: #ffffff url('{% static "asets/images/loader.gif" %}') no-repeat center center;
        background-size: 10%;
        height: 100vh;
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 999999;
      }
    </style>

    <title>Eagle in Cloud HRMS - Employee Portal</title>
  </head>
  <body>
    <div id="preloader"></div>
    <script>
      (function() {
        function hidePreloader() {
          var p = document.getElementById("preloader");
          if (p && p.style.display !== "none") {
            p.style.opacity = "0";
            p.style.transition = "opacity 0.2s ease";
            setTimeout(function() { p.style.display = "none"; }, 200);
          }
        }
        if (document.readyState === "complete") {
          hidePreloader();
        } else {
          window.addEventListener("load", hidePreloader);
          document.addEventListener("DOMContentLoaded", function() {
            setTimeout(hidePreloader, 400);
          });
        }
      })();
    </script>
    
    <div class="wrapper">
