name: Auto Deploy to Production (EC2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 Port 8001
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Repository Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "."
          target: "/home/ec2-user/employeeconduct"
          rm: false

      - name: Execute Remote Deployment Script on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "=== Starting Automated EC2 Deployment ==="
            cd /home/ec2-user/employeeconduct
            
            # 1. Activate Python environment
            source venv/bin/activate
            
            # 2. Install any new dependencies
            pip install -r requirements.txt --quiet
            
            # 3. Apply database migrations
            python manage.py migrate --noinput
            
            # 4. Safely restart only Employee Conduct on Port 8001
            sudo fuser -k 8001/tcp || true
            nohup python -u manage.py runserver 0.0.0.0:8001 > django.log 2>&1 &
            
            # 5. Verify server is listening
            sleep 3
            sudo lsof -i :8001
            echo "=== Deployment to EC2 Port 8001 Completed Successfully ==="
