name: Auto Deploy to Production (EC2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 Port 8001
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Starting deployment of main branch to EC2..."
            cd /home/ec2-user/employeeconduct
            
            # Fetch latest changes and switch to main
            git fetch origin main
            git checkout main
            git pull origin main
            
            # Activate Python virtual environment and update packages
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            
            # Run database migrations
            python manage.py migrate --noinput
            
            # Restart only Employee Conduct process on port 8001
            sudo fuser -k 8001/tcp || true
            nohup python -u manage.py runserver 0.0.0.0:8001 > django.log 2>&1 &
            
            # Verify port 8001 is active
            sleep 3
            sudo lsof -i :8001
            echo "Deployment to EC2 Port 8001 completed successfully!"
