{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Conduct HRMS - Premium SignUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem 0; /* Add padding for long form */
        }
        .signup-wrapper {
            width: 100%;
            max-width: 550px;
            padding: 20px;
        }
        .signup-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 3rem 3rem;
            position: relative;
            overflow: hidden;
        }
        .brand-logo {
            width: 150px;
            margin-bottom: 1rem;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1.2rem;
            border: 1.5px solid #e2e8f0;
            font-size: 0.95rem;
            background: #f8fafc;
            color: #1e293b;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.4rem;
        }
        .btn-signup {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 10px;
            padding: 1rem;
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            margin-top: 1rem;
        }
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.4);
            color: #ffffff;
        }
        .login-link {
            font-size: 0.85rem;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
        .page-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }
        .back-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s ease;
            z-index: 10;
        }
        .back-btn:hover {
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-card">
            <a href="{% url 'signin' %}" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
            <div class="text-center">
                <img src="{% static 'assets/images/employee_conduct_logo.png' %}" class="brand-logo" alt="Logo">
                <h2 class="page-title">Create Account</h2>
                <p class="text-muted mb-4" style="font-size: 0.95rem;">Join us to streamline your HR processes.</p>
            </div>

            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" style="border-radius:10px; font-size:0.9rem;" role="alert">
                <strong>Message: </strong> {{ message }}
            </div>
            {% endfor %}

            <form action="{% url 'signup' %}" method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="company_name" class="form-label">Company Name</label>
                        <input type="text" class="form-control" name="company_name" id="company_name" placeholder="Acme Corp" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="company_phone" class="form-label">Company Phone</label>
                    <input type="text" class="form-control" name="company_phone" id="company_phone" placeholder="+1 234 567 8900" required>
                </div>
                
                <div class="mb-3">
                    <label for="company_address" class="form-label">Company Address</label>
                    <input type="text" class="form-control" name="company_address" id="company_address" placeholder="123 Business Avenue" required>
                </div>

                <div class="mb-3">
                    <label for="email_address" class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" id="email_address" placeholder="name@company.com" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="exampleInputPassword1" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="password2" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="password2" name="password2" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-signup w-100">Sign Up Now</button>
                
                <div class="text-center mt-4">
                    <span style="font-size: 0.85rem; color: #64748b;">Already have an account? </span>
                    <a href="{% url 'signin' %}" class="login-link">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
