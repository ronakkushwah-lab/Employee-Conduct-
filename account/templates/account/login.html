{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Conduct HRMS - Premium Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            position: relative;
        }
        .top-right-dropdown {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
        .role-dropdown-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .role-dropdown-btn:hover, .role-dropdown-btn:focus {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 3.5rem 3rem;
            position: relative;
            overflow: hidden;
        }
        .brand-logo {
            width: 160px;
            margin-bottom: 1.5rem;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.8rem 1.2rem;
            border: 1.5px solid #e2e8f0;
            font-size: 0.95rem;
            background: #f8fafc;
            color: #1e293b;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.5rem;
        }
        .btn-login {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 10px;
            padding: 1rem;
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            margin-top: 1.5rem;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.4);
        }
        .forgot-link {
            font-size: 0.85rem;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }
        .page-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }
    </style>
</head>
<body>

    <!-- Top Right Role Dropdown -->
    <div class="top-right-dropdown dropdown">
        <button class="btn role-dropdown-btn dropdown-toggle" type="button" id="roleDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            Login as: Admin
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="roleDropdown" style="border-radius: 12px; border: none; overflow: hidden;">
            <li><a class="dropdown-item py-2" href="#" onclick="setRole('Admin')">Admin</a></li>
            <li><a class="dropdown-item py-2" href="#" onclick="setRole('Manager')">Manager</a></li>
            <li><a class="dropdown-item py-2" href="#" onclick="setRole('Employee')">Employee</a></li>
        </ul>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center">
                <img src="{% static 'assets/images/employee_conduct_logo.png' %}" class="brand-logo" alt="Logo">
                <h2 class="page-title" id="login-role-text">Admin Login</h2>
                <p class="text-muted mb-4" style="font-size: 0.95rem;">Please enter your details to sign in.</p>
            </div>

            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" style="border-radius:10px; font-size:0.9rem;" role="alert">
                {{ message }}
            </div>
            {% endfor %}

            <form action="{% url 'signin' %}" method="post">
                {% csrf_token %}
                <input type="hidden" name="login_role" id="hidden_login_role" value="Admin">
                <div class="mb-4 mt-2">
                    <label for="email_address" class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" id="email_address" placeholder="name@company.com" required>
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label for="password" class="form-label mb-0">Password</label>
                        <a href="{% url 'forgotpass' %}" class="forgot-link">Forgot Password?</a>
                    </div>
                    <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-login">Sign In</button>
                
                <div class="text-center mt-4">
                    <span style="font-size: 0.85rem; color: #64748b;">Don't have an account? </span>
                    <a href="{% url 'signup' %}" class="forgot-link">Sign up</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function setRole(role) {
            document.getElementById('login-role-text').innerText = role + " Login";
            document.getElementById('roleDropdown').innerText = "Login as: " + role;
            document.getElementById('hidden_login_role').value = role;
            sessionStorage.setItem("loginRole", role);
        }
        
        // Restore from sessionStorage if user refreshed or got an error back
        document.addEventListener("DOMContentLoaded", () => {
            const savedRole = sessionStorage.getItem("loginRole") || "Admin";
            setRole(savedRole);
        });
    </script>
</body>
</html>
